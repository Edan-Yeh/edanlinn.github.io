<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>放款知識庫</title>
  <meta name="description" content="放款業務規則查詢、學習與變更複核入口">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3156'/%3E%3Cpath d='M16 18h32v7H16zm0 13h22v7H16zm0 13h28v7H16z' fill='%23f2c66d'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#edf6ff">
  <link rel="stylesheet" href="./styles.css?v=20261012-challenge">
</head>
<body>
  <aside class="sidebar" aria-label="放款知識庫導覽"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM20 4h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3z"/></svg></div><div class="side-brand"><b>放款工作空間</b><small>EDAN’S WORKSPACE</small></div><div class="side-label">工作模組</div><nav id="module-nav"></nav><div class="side-bottom">情境查詢 · 來源追溯<br>正式需求請回查原始文件。</div></aside>
  <header><div class="head"><div><div class="eyebrow">WORKSPACE <span>/</span> CTBC LOAN</div><h1>中國信託放款知識庫</h1><p class="header-description">讓業務知識、需求與測試案例，形成可追溯的工作脈絡。</p></div><div class="updated" id="updated">更新 · 2026-10-05</div></div></header>
  <main>
    <section class="summary" id="summary" aria-label="收錄資料總覽"></section>
    <section id="knowledge" class="toolbar" aria-label="知識搜尋">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="搜尋情境編號、Requirement ID 或業務關鍵字…" aria-label="搜尋知識"><button class="search-scope" data-category="全部" aria-label="搜尋全部模組">全部模組 ↗</button></div>
      <div class="filters" id="categories" aria-label="內容模組"></div><details class="advanced-filters"><summary>進階篩選 <span>流程・主題・來源・狀態</span></summary><div class="filters select-filters"><label>流程分類 <select id="group" class="chip" aria-label="流程分類"></select></label><label>主題 <select id="topic" class="chip" aria-label="主題篩選"></select></label><label>來源 <select id="source" class="chip" aria-label="來源篩選"></select></label></div><div class="filters" id="filters"></div></details><div class="filters view-switch" aria-label="閱讀視圖"><button class="chip active" data-view="work">工作查詢</button><button class="chip" data-view="learn">學習閱讀</button><button class="chip" data-view="review">變更複核</button></div>
    </section>
    <a class="challenge-entry" href="./challenge.html"><span><b>業務知識挑戰</b><small>每回合10題 · 答後回查法條與SSR章節 · 錯題複習</small></span><span>開始練習 →</span></a>
    <section id="workspace-tools" class="workspace-tools" aria-label="模組操作"></section>
    <details class="coverage-details"><summary>收錄範圍與來源說明 <span>查看完整資料範圍</span></summary><div class="notice" id="coverage"></div></details>
    <div class="list-heading"><h2 id="module-title">知識庫</h2><span id="result-count" aria-live="polite"></span></div><div id="pagination" class="pagination"></div>
    <section class="layout">
      <div class="list" id="list"></div>
      <article class="detail" id="detail"><div class="empty">請選擇左側知識項目</div></article>
    </section>
  </main>
  <dialog id="editor-dialog" aria-label="知識編輯器"></dialog>
  <script src="./workspace.js?v=20261012-challenge" defer></script>
  <script src="./app.js?v=20261012-challenge" defer></script>
</body>
</html>
